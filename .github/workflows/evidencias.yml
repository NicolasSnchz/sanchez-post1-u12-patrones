# Flujo temporal: mide la evidencia del proyecto y la publica en la rama evidencias.
# Se retira cuando la evidencia queda guardada en docs/.
name: Evidencias

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  medir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            23
            17
          cache: maven
      - name: Medir el proyecto
        run: bash .github/evidencias/medir.sh
      - name: Capturar el historial de Actions (solo en el push del revert)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git log -1 --format=%s | grep -q '^Revert "test: violacion'; then
            VIOLACION=$(git log --format=%H -F --grep="test: violacion de arquitectura intencional" | tail -1)
            bash .github/evidencias/esperar-runs.sh "$VIOLACION" "$RUNNER_TEMP/runs.txt" | tee evid/logs/esperar-runs.txt
            read -r RUN_VIOLACION RUN_REVERT < "$RUNNER_TEMP/runs.txt"
            (cd "$RUNNER_TEMP" && npm install --silent playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null)
            NODE_PATH="$RUNNER_TEMP/node_modules" node .github/evidencias/capturar-github.js \
              "$GITHUB_REPOSITORY" evid "$RUN_VIOLACION" "$RUN_REVERT"
          else
            echo "Este push no es el del revert: no hay historial que capturar todavia"
          fi
      - name: Publicar en la rama evidencias
        if: always()
        run: |
          cd evid
          git init -q -b evidencias
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Evidencias de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evidencias
