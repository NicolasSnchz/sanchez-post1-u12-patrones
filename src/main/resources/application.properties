spring.application.name=reembolsos-integrado
spring.datasource.url=jdbc:h2:mem:reembolsos
# la API no expone entidades perezosas; se apaga para que Spring no lo advierta en cada arranque
spring.jpa.open-in-view=false
# SolicitudReembolso se mapea en XML para que el dominio no dependa de JPA (ver Inconsistencias en el README)
spring.jpa.mapping-resources=META-INF/orm.xml
